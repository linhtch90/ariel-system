server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ariel-edge-gateway
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

ariel:
  gateway:
    rate-limit:
      burst-capacity: 5000
  services:
    ingestion-url: ${INGESTION_SERVICE_URL:http://localhost:8081}
    query-url: ${QUERY_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
