server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: ariel-ledger-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${POSTGRES_URL:jdbc:h2:mem:ariel_ledger;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${POSTGRES_USER:ariel}
    password: ${POSTGRES_PASSWORD:ariel}
    hikari:
      maximum-pool-size: 25
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
