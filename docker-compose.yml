name: ariel-cloud-native-stack

services:
  postgres:
    image: postgres:17-alpine
    container_name: ariel-postgres
    environment:
      POSTGRES_DB: ariel_ledger
      POSTGRES_USER: ariel
      POSTGRES_PASSWORD: ariel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariel -d ariel_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8.0-alpine
    container_name: ariel-redis
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: ariel-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12

  scylladb:
    image: scylladb/scylla:6.2
    container_name: ariel-scylladb
    command: --smp 1 --memory 750M --overprovisioned 1
    ports:
      - "9042:9042"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: ariel-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ariel_analytics
      CLICKHOUSE_USER: ariel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ariel
